rule-anchor:
  # =========================
  # 订阅测速锚点
  # =========================
  dycs: &dycs {type: http, interval: 86400, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 180}, proxy: DIRECT}
  # =========================
  # 节点测速锚点
  # =========================
  cs: &cs {url: https://www.gstatic.com/generate_204, interval: 180, timeout: 5000}
  # =========================
  # 规则集锚点
  # =========================
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 🎯 全球直连}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 🎯 全球直连}
  class_yaml: &class_yaml {type: http, interval: 86400, behavior: classical, format: yaml, proxy: 🎯 全球直连}
  #class: &class {type: http, interval: 86400, behavior: classical, format: text, proxy: 🎯 全球直连}
  # =========================
  # 节点锚点
  # =========================
  cl: &cl {type: select, proxies: [🚀 节点选择, ♻️ 全球自动, ♻️ 台湾智能, ♻️ 香港智能, ♻️ 日本智能, ♻️ 新加坡智能, ♻️ 美国智能, 🔯 台湾故转, ⚖️ 台湾均衡, 🚀 全球手动, 🎯 全球直连, 🛑 全球拦截], icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Global.png}
  # =========================
  # 节点筛选
  # =========================
  pc: &pc {filter: "^(?!.*(?:订阅|官网|流量|到期|过期|故障|失效|维护|暂停|测试|备用|客服|群|购买|套餐|续费|通知)).*$"}
  bt: &bt {filter: "^(?=.*(?:Taiwan|TW|台湾|台北|Taipei))(?!(?:.*?(订阅|官网|流量|到期|过期|故障|失效|维护|测试|备用))).*$", icon: https://gh-proxy.com/https://github.com/Koolson/Qure/blob/master/IconSet/Color/Taiwan.png}
  bh: &bh {filter: "^(?=.*(?:Hong Kong|HongKong|HK|香港))(?!(?:.*?(订阅|官网|流量|到期|过期|故障|失效|维护|测试|备用))).*$", icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Hong_Kong.png}
  bj: &bj {filter: "^(?=.*(?:Japan|JP|日本|东京|Tokyo))(?!(?:.*?(订阅|官网|流量|到期|过期|故障|失效|维护|测试|备用))).*$", icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Japan.png}
  bs: &bs {filter: "^(?=.*(?:新加坡|狮城|SG|Singapore))(?!(?:.*?(订阅|官网|流量|到期|过期|故障|失效|维护|测试|备用))).*$", icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Singapore.png}
  bu: &bu {filter: "^(?=.*(?:USA|United States|美国|洛杉矶|Los Angeles|New York))(?!(?:.*?(订阅|官网|流量|到期|过期|故障|失效|维护|测试|备用))).*$", icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/USA.png}
  # =========================
  # 智能 / 自动 / 故转 / 均衡
  # =========================
  lm: &lm {type: smart, uselightgbm: true, collectdata: true, include-all: true}
  #lm: &lm {type: smart, uselightgbm: true, collectdata: false, include-all: true}
  zd: &zd {type: url-test, include-all: true, tolerance: 20}
  sd: &sd {type: select, include-all: true}
  gz: &gz {type: fallback, include-all: true}
  jh: &jh {type: load-balance, strategy: consistent-hashing, include-all: true, tolerance: 20}

  # =========================
  # 策略锚点
  # =========================
  st: &st {type: select, proxies: [♻️ 台湾智能, 🚀 节点选择]}
  sh: &sh {type: select, proxies: [♻️ 香港智能, 🚀 节点选择]}
  sj: &sj {type: select, proxies: [♻️ 日本智能, 🚀 节点选择]}
  ss: &ss {type: select, proxies: [♻️ 新加坡智能, 🚀 节点选择]}
  su: &su {type: select, proxies: [♻️ 美国智能, 🚀 节点选择]}

proxy-providers:
  Sub-Store:
    <<: *dycs
    url: "http://192.168.10.2:3001/QWERT01234asdfg56789/download/collection/Sub%20Store"

# =========================
# 基础代理
# =========================
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false

# 连接优化
unified-delay: true
tcp-concurrent: true

# 日志
log-level: warning

# TCP KeepAlive
keep-alive-idle: 600
keep-alive-interval: 15

# 路由器环境不要做进程匹配
#find-process-mode: off

# =========================
# 状态持久化
# =========================
profile:
  store-selected: true
  store-fake-ip: true

# =========================
# 外部控制 / Zashboard
# =========================
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "ui"
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# =========================
# Smart LightGBM
# =========================
lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://gh-proxy.com/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    # Wi-Fi Calling / 3GPP / ePDG    
    - "+.pub.3gppnetwork.org"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver-follow-policy: false

  listen: 0.0.0.0:1053
      
sniffer:
  enable: true

  # 对已有 DNS 映射的流量也进行域名识别
  force-dns-mapping: true

  # 对没有域名信息的纯 IP 流量尝试嗅探
  parse-pure-ip: true

  # 全局先不要强制覆盖目标地址
  override-destination: false

  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]

  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

