# =========================
# 基础代理
# =========================
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false

# 连接优化
unified-delay: true
tcp-concurrent: true

# 日志
log-level: warning

# TCP KeepAlive
keep-alive-idle: 600
keep-alive-interval: 15

# 路由器环境不要做进程匹配
#find-process-mode: off

# =========================
# 状态持久化
# =========================
profile:
  store-selected: true
  store-fake-ip: true

# =========================
# 外部控制 / Zashboard
# =========================
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "ui"
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

tun:
  enable: true
  stack: mixed
 # dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16

  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 单标签主机名 / 本地网络
    - "*"
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.localhost"
    - "+.invalid"
    - "+.test"
    - "+.example"
    - "+.arpa"

    # Windows / 浏览器连通性检测
    - "detectportal.firefox.com"
    - "network-test.debian.org"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

    # 时间同步
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"

    # STUN / TURN
    - "global.turn.twilio.com"
    - "global.stun.twilio.com"

    # Wi-Fi Calling / 3GPP / ePDG
    - "+.pub.3gppnetwork.org"

    # 中国运营商认证
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "+.opencloud.wostore.cn"
    - "id.mail.wo.cn"
    - "mdn.open.wo.cn"
    - "nishub1.10010.com"
    - "enrichgw.10010.com"

    # Xiaomi IoT
    - "+.market.xiaomi.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  direct-nameserver-follow-policy: false

  listen: 0.0.0.0:1053
      
sniffer:
  enable: true

  # 对已有 DNS 映射的流量也进行域名识别
  force-dns-mapping: true

  # 对没有域名信息的纯 IP 流量尝试嗅探
  parse-pure-ip: true

  # 全局先不要强制覆盖目标地址
  override-destination: false

  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]

  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
 
 # 锚点
pr: &pr {type: select, proxies: [🚀 节点选择, ♻️ 全球自动, ♻️ 台湾自动, ♻️ 香港自动, ♻️ 日本自动, ♻️ 新加坡自动, ♻️ 美国自动, ⚖️ 台湾均衡, 🚀 全球手动, 🎯 全球直连, 🛑 全球拦截], icon: https://gh-proxy.com/https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Global.png}
